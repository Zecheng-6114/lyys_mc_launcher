[package]
name = "lyys_mc_launcher"
version = "0.0.1-alpha"
edition = "2024"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["image", "http"] }
# egui_extras 的图片加载器不启用解码格式，这里通过 feature 合并打开 PNG/JPEG/WebP
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
mc-launcher-core = "0.1.2"
md-5 = "0.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
# 整合包解析只需要解压 deflate/store，关掉 bzip2/zstd/aes 等默认特性
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
