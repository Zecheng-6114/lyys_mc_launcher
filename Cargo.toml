[package]
name = "lyys_mc_launcher"
version = "0.0.1-alpha"
edition = "2024"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
eframe = "0.37.0"
mc-launcher-core = "0.1.2"
md-5 = "0.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
