name: 构建发行版

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 构建
        run: cargo build --release

      - name: 打包
        run: Compress-Archive -Path target/release/lyys_mc_launcher.exe -DestinationPath lyys_mc_launcher-${{ github.ref_name }}.zip

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: lyys_mc_launcher-${{ github.ref_name }}.zip
